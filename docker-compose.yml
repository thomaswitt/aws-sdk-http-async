# docker-compose.yml

name: aws-sdk-http-async

services:
  dynamodb-local:
    image: "amazon/dynamodb-local:3.3.2"
    container_name: dynamodb-local-8011
    entrypoint:
      - "bash"
      - "-c"
      - |
        set -euo pipefail
        port="$${DYNAMODB_PORT:-8011}"
        exec java -jar DynamoDBLocal.jar -sharedDb -disableTelemetry -inMemory -port "$${port}"
    environment:
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_DEFAULT_REGION=eu-central-1
    ports:
      - "8011:8011"
    working_dir: /home/dynamodblocal
    ulimits:
      nofile:
        soft: "65536"
        hard: "65536"

    healthcheck:
      test: ["CMD", "aws", "dynamodb", "list-tables", "--endpoint-url", "http://localhost:8011"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:1.0.7
    container_name: rustfs-local-9010
    restart: always
    ports:
      - "9010:9010"
      - "9011:9011"
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_ADDRESS=0.0.0.0:9010
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9011
      - RUSTFS_REGION=eu-central-1

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tinyproxy:
    image: kalaksi/tinyproxy:1.7
    container_name: tinyproxy-8888
    restart: always
    ports:
      - "8888:8888"
    volumes:
      - ./spec/support/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    container_name: toxiproxy-8080
    restart: always
    ports:
      - "8474:8474"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
